spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
app:
  frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: INFO
